<title>Rechargement &amp; Purge du Cache — William Guindon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#064e3b">
<link rel="stylesheet" href="style.css?v=20260919-reload">
<style>
  .reload-box {
    max-width: 540px;
    margin: 80px auto;
    padding: 36px 28px;
    background: var(--bg-card, #111827);
    border: 1px solid var(--border, #1f2937);
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  .reload-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(16, 185, 129, 0.2);
    border-top-color: var(--accent, #10b981);
    border-radius: 50%;
    margin: 0 auto 20px auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .reload-step {
    font-size: 14px;
    color: var(--text-muted, #9ca3af);
    margin-top: 8px;
    min-height: 20px;
  }
  .reload-progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin: 20px 0;
    overflow: hidden;
    position: relative;
  }
  .reload-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent, #10b981);
    transition: width 0.3s ease;
  }
</style>
</head>
<body class="dark-theme">

<div class="wrap">
  <main id="main-content">
    <div class="reload-box">
      <div class="reload-spinner" id="spinner" aria-hidden="true"></div>
      <h1 style="font-size:1.4rem; font-weight:800; margin-bottom:8px; color:var(--text, #f9fafb);">Mise à jour &amp; Purge Totale</h1>
      <p style="font-size:14px; color:var(--text-muted, #9ca3af); line-height:1.5;">
        Suppression intégrale du cache local et rechargement de la toute dernière version du site...
      </p>

      <div class="reload-progress-bar">
        <div class="reload-progress-fill" id="progress-fill"></div>
      </div>

      <div class="reload-step" id="reload-status">Initialisation de la purge...</div>

      <div style="margin-top:24px;">
        <button type="button" id="btn-force-now" class="btn btn-primary" style="font-size:13px; padding:8px 18px; display:none;">
          Accéder immédiatement au site ↗
        </button>
      </div>
    </div>
  </main>
</div>

<script>
(async function() {
  'use strict';
  const statusEl = document.getElementById('reload-status');
  const fillEl = document.getElementById('progress-fill');
  const btnNow = document.getElementById('btn-force-now');

  // Déterminer la page de destination (paramètre ?to=... ou racine)
  const params = new URLSearchParams(window.location.search);
  let targetUrl = params.get('to') || '/';
  if (targetUrl.startsWith('http://') || targetUrl.startsWith('https://')) {
    try {
      const parsed = new URL(targetUrl);
      if (parsed.hostname !== window.location.hostname) targetUrl = '/';
    } catch (_) {
      targetUrl = '/';
    }
  }

  if (btnNow) {
    btnNow.onclick = () => { window.location.replace(targetUrl + (targetUrl.includes('?') ? '&' : '?') + '_v=' + Date.now()); };
  }

  async function purgeAll() {
    try {
      if (statusEl) statusEl.textContent = '1/3 · Purge du stockage de session...';
      if (fillEl) fillEl.style.width = '30%';
      try { sessionStorage.clear(); } catch (_) {}

      if (statusEl) statusEl.textContent = '2/3 · Nettoyage des caches Service Worker...';
      if (fillEl) fillEl.style.width = '60%';
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }

      if (statusEl) statusEl.textContent = '3/3 · Réinitialisation des Workers...';
      if (fillEl) fillEl.style.width = '90%';
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }

      if (fillEl) fillEl.style.width = '100%';
      if (statusEl) statusEl.textContent = '✓ Cache purgé avec succès. Redirection...';

      setTimeout(() => {
        const sep = targetUrl.includes('?') ? '&' : '?';
        window.location.replace(targetUrl + sep + '_v=' + Date.now());
      }, 500);

    } catch (err) {
      console.warn('Erreur purge:', err);
      if (statusEl) statusEl.textContent = 'Rechargement immédiat...';
      if (btnNow) btnNow.style.display = 'inline-block';
      setTimeout(() => {
        window.location.replace(targetUrl + (targetUrl.includes('?') ? '&' : '?') + '_v=' + Date.now());
      }, 800);
    }
  }

  purgeAll();
})();
</script>
</body>
</html>
