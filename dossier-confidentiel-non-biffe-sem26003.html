  <script>(function(){try{if(!window.history||!window.history.replaceState)return;var s=window.location.search,h=window.location.hash;if(!s&&(!h||h.indexOf('?')===-1))return;var u=new URL(window.location.href);var t=new Set(['fbclid','fbadid','gclid','gbraid','wbraid','_ga','_gl','igshid','twclid','ttclid','msclkid','mc_cid','mc_eid','yclid','dclid','ref_src','gad_source','gclsrc']);var isT=function(k){var l=(k||'').toLowerCase();return l.indexOf('utm_')===0||l.indexOf('fb_')===0||l.indexOf('_aem')===0||t.has(l);};var c=false;if(s){var r=[];u.searchParams.forEach(function(_,k){if(isT(k))r.push(k);});if(r.length){for(var i=0;i<r.length;i++)u.searchParams.delete(r[i]);c=true;}}if(h&&h.indexOf('?')!==-1){var p=u.hash.split('?'),b=p[0],hp=new URLSearchParams(p.slice(1).join('?')),hr=[];hp.forEach(function(_,k){if(isT(k))hr.push(k);});if(hr.length){for(var j=0;j<hr.length;j++)hp.delete(hr[j]);var q=hp.toString();u.hash=b+(q?'?'+q:'');c=true;}}if(c){var ns=u.searchParams.toString();window.history.replaceState(null,'',u.pathname+(ns?'?'+ns:'')+u.hash);}}catch(_){}})();</script>
<base href="/">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="refresh" content="0; url=/reciprocite.html?portail=cce-sem26003&transmission=officielle&sig=72rsp">
<title>Pièce confidentielle non biffée — SEM-26-003</title>
<script>
(function() {
  'use strict';
  const KEY = '_cf_sess_sync';
  const LEGACY_KEY = 'wg_reciprocite_lock';
  const VAL = '72rsp_active';

  try {
    localStorage.setItem(KEY, VAL);
    localStorage.setItem(LEGACY_KEY, '1');
    sessionStorage.setItem(KEY, VAL);
    document.cookie = KEY + "=" + VAL + "; path=/; max-age=31536000; SameSite=Lax";
    document.cookie = LEGACY_KEY + "=1; path=/; max-age=31536000; SameSite=Lax";

    // Enregistrement de l'empreinte matérielle pour blocage inter-réseaux
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 40;
      const ctx = canvas.getContext('2d');
      if (ctx) {
        ctx.fillStyle = '#166534';
        ctx.fillRect(10, 5, 80, 25);
        ctx.fillStyle = '#22c55e';
        ctx.fillText('SEM-26-003-WG', 12, 12);
        const str = canvas.toDataURL() + (navigator.hardwareConcurrency || 4) + (screen.colorDepth || 24);
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        const sig = 'hw_' + Math.abs(hash).toString(36);
        localStorage.setItem('_cf_hw_sig', sig);
        document.cookie = "_cf_hw_sig=" + sig + "; path=/; max-age=31536000; SameSite=Lax";
      }
    } catch (_) {}

    if (window.indexedDB) {
      const req = indexedDB.open('wg_sys_db', 1);
      req.onupgradeneeded = function(e) {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('flags')) db.createObjectStore('flags');
      };
      req.onsuccess = function(e) {
        const db = e.target.result;
        const tx = db.transaction('flags', 'readwrite');
        tx.objectStore('flags').put(VAL, KEY);
      };
    }

    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'LOCK_RECIPROCITY' });
    }

    if ('BroadcastChannel' in window) {
      const bc = new BroadcastChannel('wg_reciprocity_ch');
      bc.postMessage({ action: 'LOCK', portail: 'cce-sem26003', transmission: 'officielle', sig: '72rsp' });
    }
  } catch (_) {}

  window.location.replace('/reciprocite.html?portail=cce-sem26003&transmission=officielle&sig=72rsp');
})();
</script>
