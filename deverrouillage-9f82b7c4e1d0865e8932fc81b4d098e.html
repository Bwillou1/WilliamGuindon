<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déverrouillage & Réinitialisation de sécurité — William Guindon</title>
<style>
body {
  background-color: #070a12;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}
.unlock-card {
  max-width: 540px;
  width: 100%;
  background: #0f172a;
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 16px;
  padding: 36px 28px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(34, 197, 94, 0.15);
}
.unlock-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #22c55e;
}
.unlock-title {
  font-size: 21px;
  font-weight: 800;
  color: #ffffff;
  margin: 0 0 10px 0;
}
.unlock-desc {
  font-size: 14px;
  line-height: 1.6;
  color: #cbd5e1;
  margin: 0 0 20px 0;
}
.unlock-badge {
  display: inline-block;
  padding: 5px 12px;
  background: rgba(34, 197, 94, 0.2);
  color: #86efac;
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 24px;
}
.unlock-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 22px;
  background: #22c55e;
  color: #052e16 !important;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  border-radius: 8px;
  transition: all 0.2s ease;
}
.unlock-btn:hover {
  background: #16a34a;
  color: #ffffff !important;
}
</style>
</head>
<body>

<div class="unlock-card">
  <div class="unlock-icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
  </div>
  <h1 class="unlock-title">Réinitialisation de sécurité réussie</h1>
  <div class="unlock-badge">✓ Verrous Evercookie & Empreintes supprimés</div>
  <p class="unlock-desc">
    Toutes les restrictions de réciprocité, cookies persistants, bases IndexedDB et empreintes matérielles ont été détruits avec succès pour ce navigateur.
  </p>
  <a href="./" class="unlock-btn" id="go-home-btn">Accéder à l'accueil citoyen</a>
</div>

<script>
(function() {
  'use strict';
  const KEY = '_cf_sess_sync';
  const LEGACY_KEY = 'wg_reciprocite_lock';
  const HW_KEY = '_cf_hw_sig';

  try {
    // 1. Purge LocalStorage & SessionStorage
    localStorage.removeItem(KEY);
    localStorage.removeItem(LEGACY_KEY);
    localStorage.removeItem(HW_KEY);
    sessionStorage.removeItem(KEY);
    sessionStorage.removeItem(HW_KEY);

    // 2. Purge Cookies
    document.cookie = KEY + "=; path=/; max-age=0";
    document.cookie = LEGACY_KEY + "=; path=/; max-age=0";
    document.cookie = HW_KEY + "=; path=/; max-age=0";

    // 3. Purge IndexedDB
    if (window.indexedDB) {
      const req = indexedDB.open('wg_sys_db', 1);
      req.onsuccess = function(e) {
        const db = e.target.result;
        if (db.objectStoreNames.contains('flags')) {
          const tx = db.transaction('flags', 'readwrite');
          tx.objectStore('flags').clear();
        }
      };
    }

    // 4. Notification Service Worker
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'UNLOCK_RECIPROCITY' });
    }

    // 5. Purge Cache Storage
    if (window.caches) {
      caches.delete('wg-sec-flags').catch(function() {});
    }

    // 6. BroadcastChannel aux autres onglets
    if ('BroadcastChannel' in window) {
      const bc = new BroadcastChannel('wg_reciprocity_ch');
      bc.postMessage({ action: 'UNLOCK' });
    }
  } catch (_) {}

  // Redirection automatique vers l'accueil après 1.8 seconde
  setTimeout(function() {
    window.location.replace('./');
  }, 1800);
})();
</script>

</body>
</html>
