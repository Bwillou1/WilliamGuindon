  function processFiles(filesData) {
    const treeContainer = document.getElementById("drive-tree");
    if (!treeContainer) return;
    treeContainer.innerHTML = "";

    // Filtrer les fichiers systèmes et métadonnées internes
    const validFiles = filesData.filter(item => {
      const name = typeof item === "string" ? item : item.name;
      return !name.endsWith('_meta.sqlite') && 
             !name.endsWith('_meta.xml') && 
             !name.endsWith('_files.xml') && 
             !name.endsWith('_archive.torrent') &&
             !name.startsWith('__ia_thumb') &&
             !name.includes('.thumbs/') &&
             !name.includes('00_GUIDE_JOURNALISTES_BIFFE');
    });

    const titleEl = document.getElementById("title-count");
    if (titleEl) {
      titleEl.innerHTML = 'Grande Tourbière de Blainville <span class="drive-badge-count">' + validFiles.length + ' pièces</span>';
    }

    // Construction de l'arbre multi-niveaux récursif
    const root = { subfolders: {}, files: [] };

    validFiles.forEach(item => {
      const fullPath = typeof item === "string" ? item : item.name;
      let clean = fullPath;
      if (clean.startsWith("00_DOSSIER_POUR_JOURNALISTES_BIFFE/")) {
        clean = clean.replace("00_DOSSIER_POUR_JOURNALISTES_BIFFE/", "");
      }

      const parts = clean.split('/');
      const fileName = parts.pop();
      let current = root;

      parts.forEach(folderName => {
        if (!current.subfolders[folderName]) {
          current.subfolders[folderName] = { subfolders: {}, files: [] };
        }
        current = current.subfolders[folderName];
      });

      current.files.push({
        name: fileName,
        fullPath: fullPath.startsWith("00_DOSSIER_POUR_JOURNALISTES_BIFFE/") ? fullPath : "00_DOSSIER_POUR_JOURNALISTES_BIFFE/" + fullPath
      });
    });

    const stage = document.getElementById("preview-stage");
    let firstSelected = false;

    function renderTree(node, container, isRoot = false) {
      // 1. Dossiers et sous-dossiers
      const folderNames = Object.keys(node.subfolders).sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
      folderNames.forEach((folderName, idx) => {
        const subNode = node.subfolders[folderName];
        const nodeDiv = document.createElement("div");
        // Ouvrir le premier dossier par défaut pour rendre les premiers documents directement visibles
        nodeDiv.className = "tree-node" + (idx === 0 ? " open" : "");

        function countTotal(n) {
          let total = n.files.length;
          for (let k in n.subfolders) total += countTotal(n.subfolders[k]);
          return total;
        }

        const count = countTotal(subNode);
        const header = document.createElement("div");
        header.className = "tree-folder-header";
        header.innerHTML = `
          <span class="folder-chevron">▶</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span class="folder-name" title="${folderName}">${folderName}</span>
          <span class="folder-count">${count}</span>
        `;

        header.addEventListener("click", (e) => {
          e.stopPropagation();
          nodeDiv.classList.toggle("open");
        });

        const childrenContainer = document.createElement("div");
        childrenContainer.className = "tree-children";

        renderTree(subNode, childrenContainer, false);

        nodeDiv.appendChild(header);
        nodeDiv.appendChild(childrenContainer);
        container.appendChild(nodeDiv);
      });

      // 2. Fichiers du niveau courant
      node.files.sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true })).forEach(fileObj => {
        const item = document.createElement("div");
        item.className = "drive-item";

        const lower = fileObj.name.toLowerCase();
        let svgIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52796f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';

          svgIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>';
        } else if (lower.endsWith(".mp4") || lower.endsWith(".mov")) {

          svgIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>';
        } else if (lower.endsWith(".zip") || lower.endsWith(".tar")) {
          svgIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline></svg>';
        }

        item.innerHTML = `
          <span style="display:inline-flex;align-items:center;flex-shrink:0;">${svgIcon}</span>
          <span class="drive-item-name" title="${fileObj.name}">${fileObj.name}</span>
        `;

        const fileUrl = "https://archive.org/download/" + identifier + "/" + encodeURI(fileObj.fullPath);
        const corsPdfUrl = "https://archive.org/cors/" + identifier + "/" + encodeURI(fileObj.fullPath);

        item.addEventListener("click", (e) => {
          e.stopPropagation();
          document.querySelectorAll(".drive-item").forEach(el => el.classList.remove("active"));
          item.classList.add("active");

          const curFile = document.getElementById("current-filename");
          if (curFile) curFile.textContent = fileObj.name;
          const directLink = document.getElementById("direct-file-link");
          if (directLink) {
            directLink.href = fileUrl;
            directLink.style.display = "inline";
          }

          if (stage) {
            stage.innerHTML = "";

            if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp") || lower.endsWith(".gif")) {
              const img = document.createElement("img");
              img.src = fileUrl;
              img.className = "preview-image";
              img.alt = fileObj.name;
              stage.appendChild(img);
            } else if (lower.endsWith(".mp4") || lower.endsWith(".mov")) {
              const video = document.createElement("video");
              video.src = fileUrl;
              video.controls = true;
              video.autoplay = true;
              video.className = "preview-video";
              stage.appendChild(video);
            } else if (lower.endsWith(".pdf")) {
              const iframe = document.createElement("iframe");
              iframe.className = "preview-iframe";
              // Intégration dans le lecteur officiel avec support CORS direct
              iframe.src = "viewer.html?file=" + encodeURIComponent(corsPdfUrl);
              iframe.title = fileObj.name;
              stage.appendChild(iframe);
            } else {
              const box = document.createElement("div");
              box.className = "no-preview";
              box.innerHTML = `
                <span style="display:inline-flex;margin-bottom:8px;">${svgIcon}</span>
                <h4 style="margin: 0 0 8px 0; color: #064e3b;">${fileObj.name}</h4>
                <p>Ce document est disponible en consultation directe.</p>
                <a href="${fileUrl}" class="btn-download-single" target="_blank" rel="noopener">Télécharger le document</a>
              `;
              stage.appendChild(box);
            }
          }
        });

        container.appendChild(item);

        if (!firstSelected && lower.endsWith(".pdf")) {
          setTimeout(() => item.click(), 60);
          firstSelected = true;
        }
      });
    }

    renderTree(root, treeContainer, true);
  }

  // Tente d'interroger l'API pour récupérer les 222 fichiers en direct ; bascule instantanément sur la liste complète en cas de blocage réseau
  fetch(apiUrl)
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(data => {
      if (data && data.result && data.result.length > 50) {
        processFiles(data.result);
      } else {
        processFiles(fallbackList);
      }
    })
    .catch(() => {
      processFiles(fallbackList);
    });

  // Gestion du redimensionnement glissant et du repli de la barre latérale gauche
  const splitter = document.getElementById("drive-splitter");
  const treePane = document.getElementById("drive-tree");
  const driveBody = document.querySelector(".drive-body");
  const btnToggleTree = document.getElementById("btn-toggle-tree");
  const btnToggleText = document.getElementById("btn-toggle-tree-text");

  let isDragging = false;
  const savedWidth = localStorage.getItem("wg_drive_tree_w") || "290";

  if (treePane && window.innerWidth > 768) {
    treePane.style.width = savedWidth + "px";
  }

  function toggleTreeSidebar(forceState) {
    if (!treePane) return;
    const isCurrentlyCollapsed = treePane.classList.contains("collapsed");
    const shouldCollapse = (typeof forceState === "boolean") ? forceState : !isCurrentlyCollapsed;

    if (shouldCollapse) {
      treePane.classList.add("collapsed");
      if (btnToggleTree) btnToggleTree.classList.add("is-collapsed");
      if (btnToggleText) btnToggleText.textContent = "Afficher barre";
      if (splitter) splitter.style.display = "none";
    } else {
      treePane.classList.remove("collapsed");
      if (btnToggleTree) btnToggleTree.classList.remove("is-collapsed");
      if (btnToggleText) btnToggleText.textContent = "Réduire barre";
      if (splitter) splitter.style.display = "flex";
      const w = localStorage.getItem("wg_drive_tree_w") || "290";
      treePane.style.width = w + "px";
    }
    window.dispatchEvent(new Event("resize"));
  }

  if (btnToggleTree) {
    btnToggleTree.addEventListener("click", () => toggleTreeSidebar());
  }

  if (splitter && treePane && driveBody) {
    splitter.addEventListener("mousedown", (e) => {
      e.preventDefault();
      isDragging = true;
      splitter.classList.add("is-dragging");
      treePane.classList.add("is-resizing");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const rect = driveBody.getBoundingClientRect();
      let newW = e.clientX - rect.left;
      if (newW < 140) newW = 140;
      if (newW > rect.width * 0.75) newW = rect.width * 0.75;
      treePane.style.width = Math.round(newW) + "px";
      localStorage.setItem("wg_drive_tree_w", Math.round(newW));
    });

    window.addEventListener("mouseup", () => {
      if (isDragging) {
        isDragging = false;
        splitter.classList.remove("is-dragging");
        treePane.classList.remove("is-resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        window.dispatchEvent(new Event("resize"));
      }
    });

    // Support tactile (tablettes et mobiles tactiles)
    splitter.addEventListener("touchstart", () => {
      isDragging = true;
      splitter.classList.add("is-dragging");
      treePane.classList.add("is-resizing");
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (!isDragging || !e.touches[0]) return;
      const rect = driveBody.getBoundingClientRect();
      let newW = e.touches[0].clientX - rect.left;
      if (newW < 140) newW = 140;
      if (newW > rect.width * 0.75) newW = rect.width * 0.75;
      treePane.style.width = Math.round(newW) + "px";
      localStorage.setItem("wg_drive_tree_w", Math.round(newW));
    }, { passive: true });

    window.addEventListener("touchend", () => {
      if (isDragging) {
        isDragging = false;
        splitter.classList.remove("is-dragging");
        treePane.classList.remove("is-resizing");
        window.dispatchEvent(new Event("resize"));
      }
    });
  }
})();
</script>

</body>
</html>
