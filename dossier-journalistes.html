      "A - B - C/Rejets polluants/Plan Bouchard/Site 06875001 - Camp Bouchard, ancien dépôt de munitions.pdf",
      "A - B - C/Rejets polluants/Plan Bouchard/Historique_Militaire_Depot_Munitions_Bouchard.pdf",
      "A - B - C/Rejets polluants/Plan Bouchard/Caracterisation_Pyrotechnique_Sols_Plan_Bouchard.pdf",
      "A - B - C/Rejets polluants/Plan Bouchard/Photos_Bunkers_Vestiges_Guerre.png",
      "A - B - C/Rejets polluants/Plan Bouchard/Carte_Localisation_Bunkers_Bouchard.jpg",
      "A - B - C/Rejets polluants/Plan Bouchard/Renseignements financiers-annuels/Etats_Financiers_Historiques_Bouchard.pdf",
      "A - B - C/Rejets polluants/Plan Bouchard/Renseignements financiers-annuels/Rapport_Annuel_Gestion_Sites_Contamines.pdf",
      "A - B - C/Sealosafe/pr84.pdf",
      "A - B - C/Sealosafe/rapport371.pdf",
      "A - B - C/Sealosafe/Fiche_Technique_Procede_Sealosafe_Inertisation.pdf",
      "A - B - C/Sealosafe/Diagramme_Fixation_Matrice_Sealosafe.png",
      "A - B - C/RC/RC-1.pdf",
      "A - B - C/RC/RC-2.pdf",
      "A - B - C/RC/RC-3.pdf",
      "A - B - C/RC/RC-4.pdf",
      "A - B - C/RC/RC_Recherche_Documentaire_Radio_Canada.docx",
      "A - B - C/RC/RC_Transcription_Entrevues.txt"
    ];

    function processFiles(filesData) {
      const treeContainer = document.getElementById("drive-tree");
      if (!treeContainer) return;
      treeContainer.innerHTML = "";

      // Filtrer les fichiers systèmes et métadonnées
      const validFiles = filesData.filter(item => {
        const name = typeof item === "string" ? item : item.name;
        return !name.endsWith('_meta.sqlite') && 
               !name.endsWith('_meta.xml') && 
               !name.endsWith('_files.xml') && 
               !name.startsWith('__ia_thumb') &&
               !name.includes('00_GUIDE_JOURNALISTES_BIFFE');
      });

      const titleCount = document.getElementById("title-count");
      if (titleCount) {
        titleCount.textContent = `Dossier SEM-26-003 (${validFiles.length} fichiers)`;
      }

      // Construction de l'arbre multi-niveaux récursif
      const root = { subfolders: {}, files: [] };

      validFiles.forEach(item => {
        const fullPath = typeof item === "string" ? item : item.name;
        let clean = fullPath;
        if (clean.startsWith("00_DOSSIER_POUR_JOURNALISTES_BIFFE/")) {
          clean = clean.replace("00_DOSSIER_POUR_JOURNALISTES_BIFFE/", "");
        }

        const parts = clean.split('/');
        const fileName = parts.pop();
        let current = root;

        parts.forEach(folderName => {
          if (!current.subfolders[folderName]) {
            current.subfolders[folderName] = { subfolders: {}, files: [] };
          }
          current = current.subfolders[folderName];
        });

        current.files.push({
          name: fileName,
          fullPath: fullPath.startsWith("00_DOSSIER_POUR_JOURNALISTES_BIFFE/") ? fullPath : "00_DOSSIER_POUR_JOURNALISTES_BIFFE/" + fullPath
        });
      });

      const stage = document.getElementById("preview-stage");
      let firstSelected = false;

      function renderTree(node, container, isRoot = false) {
        // 1. Dossiers et sous-dossiers
        const folderNames = Object.keys(node.subfolders).sort();
        folderNames.forEach((folderName, idx) => {
          const subNode = node.subfolders[folderName];
          const nodeDiv = document.createElement("div");
          nodeDiv.className = "tree-node" + (isRoot && idx === 0 ? " open" : "");

          function countTotal(n) {
            let total = n.files.length;
            for (let k in n.subfolders) total += countTotal(n.subfolders[k]);
            return total;
          }

          const header = document.createElement("div");
          header.className = "tree-folder-header";
          header.innerHTML = `
            <span class="folder-chevron">▶</span>
            <span>📁</span>
            <span class="folder-name" title="${folderName}">${folderName}</span>
            <span class="folder-count">(${countTotal(subNode)})</span>
          `;

          header.addEventListener("click", (e) => {
            e.stopPropagation();
            nodeDiv.classList.toggle("open");
          });

          const childrenContainer = document.createElement("div");
          childrenContainer.className = "tree-children";

          renderTree(subNode, childrenContainer, false);

          nodeDiv.appendChild(header);
          nodeDiv.appendChild(childrenContainer);
          container.appendChild(nodeDiv);
        });

        // 2. Fichiers du niveau courant
        node.files.sort((a, b) => a.name.localeCompare(b.name)).forEach(fileObj => {
          const item = document.createElement("div");
          item.className = "drive-item";

          const lower = fileObj.name.toLowerCase();
          let icon = "📄";
          if (lower.endsWith(".pdf")) icon = "📕";
          else if (lower.endsWith(".mp4") || lower.endsWith(".mov")) icon = "🎥";
          else if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp") || lower.endsWith(".gif")) icon = "🖼️";
          else if (lower.endsWith(".csv")) icon = "📊";
          else if (lower.endsWith(".zip") || lower.endsWith(".tar") || lower.endsWith(".torrent")) icon = "📦";
          else if (lower.endsWith(".docx") || lower.endsWith(".doc")) icon = "📘";
          else if (lower.endsWith(".txt") || lower.endsWith(".md") || lower.endsWith(".sha256") || lower.endsWith(".geojson") || lower.endsWith(".kml") || lower.endsWith(".ots")) icon = "📝";

          item.innerHTML = `
            <span>${icon}</span>
            <span class="drive-item-name" title="${fileObj.name}">${fileObj.name}</span>
          `;

          const fileUrl = `https://archive.org/download/${identifier}/${encodeURI(fileObj.fullPath)}`;

          item.addEventListener("click", (e) => {
            e.stopPropagation();
            document.querySelectorAll(".drive-item").forEach(el => el.classList.remove("active"));
            item.classList.add("active");

            const curFile = document.getElementById("current-filename");
            if (curFile) curFile.textContent = fileObj.name;
            const directLink = document.getElementById("direct-file-link");
            if (directLink) {
              directLink.href = fileUrl;
              directLink.style.display = "inline";
            }

            if (stage) {
              stage.innerHTML = "";

              if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp") || lower.endsWith(".gif")) {
                const img = document.createElement("img");
                img.src = fileUrl;
                img.className = "preview-image";
                img.alt = fileObj.name;
                stage.appendChild(img);
              } else if (lower.endsWith(".mp4") || lower.endsWith(".mov")) {
                const video = document.createElement("video");
                video.src = fileUrl;
                video.controls = true;
                video.autoplay = true;
                video.className = "preview-video";
                stage.appendChild(video);
              } else if (lower.endsWith(".pdf")) {
                const iframe = document.createElement("iframe");
                iframe.className = "preview-iframe";
                iframe.src = fileUrl;
                stage.appendChild(iframe);
              } else {
                const box = document.createElement("div");
                box.className = "no-preview";
                box.innerHTML = `
                  <span>${icon}</span>
                  <h4 style="margin: 0 0 8px 0; color: #202124;">${fileObj.name}</h4>
                  <p>Ce document est disponible en téléchargement direct.</p>
                  <a href="${fileUrl}" class="btn-download-single" target="_blank" rel="noopener">Télécharger le document</a>
                `;
                stage.appendChild(box);
              }
            }
          });

          container.appendChild(item);

          if (!firstSelected && lower.endsWith(".pdf")) {
            setTimeout(() => item.click(), 60);
            firstSelected = true;
          }
        });
      }

      renderTree(root, treeContainer, true);
    }

    // Tente d'interroger l'API pour récupérer les 230 fichiers en direct ; bascule instantanément sur la liste complète en cas de blocage réseau
    fetch(apiUrl)
      .then(r => r.json())
      .then(data => {
        if (data && data.result && data.result.length > 50) {
          processFiles(data.result);
        } else {
          processFiles(fallbackList);
        }
      })
      .catch(() => {
        processFiles(fallbackList);
      });
  })();
</script>
