name: Publication du Lecteur Local Sécurisé (GitHub Release & DMG)

on:
  push:
    tags:
      - 'vault-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Création des fichiers .DMG (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Génération des packages .DMG
        run: |
          chmod +x tools/local-vault/package-mac.sh
          bash tools/local-vault/package-mac.sh

      - name: Sauvegarde temporaire des DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-artifacts
          path: tools/local-vault/dist/*.dmg

  build-windows-linux:
    name: Compilation Windows (.exe) & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compilation Windows et Linux
        run: |
          mkdir -p tools/local-vault/dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o tools/local-vault/dist/lecteur-dossier-journalistes-windows-x64.exe tools/local-vault/main.go
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o tools/local-vault/dist/lecteur-dossier-journalistes-linux-x64 tools/local-vault/main.go

      - name: Sauvegarde temporaire des binaires
        uses: actions/upload-artifact@v4
        with:
          name: win-linux-artifacts
          path: |
            tools/local-vault/dist/lecteur-dossier-journalistes-windows-x64.exe
            tools/local-vault/dist/lecteur-dossier-journalistes-linux-x64

  release:
    name: Publication de la Release GitHub
    needs: [build-macos-dmg, build-windows-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Création du dossier d'artefacts
        run: mkdir -p dist

      - name: Téléchargement des DMG macOS
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg-artifacts
          path: dist

      - name: Téléchargement des binaires Win / Linux
        uses: actions/download-artifact@v4
        with:
          name: win-linux-artifacts
          path: dist

      - name: Calcul des sommes de contrôle SHA-256
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publication officielle sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Lecteur Local Sécurisé SEM-26-003 — ${{ github.ref_name }}"
          body: |
            ## 🔒 Archive Documentaire SEM-26-003 — Lecteur Local Autonome & Inviolable
            
            Ce lecteur de bureau autonome permet aux journalistes, avocats et citoyens de consulter les **222 pièces probatoires** du dossier en totale isolation hors-ligne, avec vérification stricte de l'ancrage cryptographique **OpenTimestamps (Blockchain Bitcoin)**.

            ### 🛡️ Empreinte Cryptographique Certifiée
            * **SHA-256 officiel de l'archive :** `3209f9ea95dfc096ebcdf1ac0288c97872206af11a6e978a74761c03b3eba4d7`
            * **Garantie :** Si le fichier ZIP a été modifié d'un seul octet, le lecteur refuse formellement le déverrouillage de l'interface.
            * **Zéro extraction sur disque :** Streaming direct depuis la mémoire vive (`zip.Reader`).

            ### 📦 Fichiers d'Installation
            * 🍏 **macOS (Apple Silicon M1/M2/M3/M4) :** `Lecteur-Dossier-Journalistes-Mac-AppleSilicon-M1-M2-M3-M4.dmg`
            * 🍏 **macOS (Intel) :** `Lecteur-Dossier-Journalistes-Mac-Intel.dmg`
            * 🪟 **Windows :** `lecteur-dossier-journalistes-windows-x64.exe`
            * 🐧 **Linux :** `lecteur-dossier-journalistes-linux-x64`
            * 📜 **Sommes de contrôle :** `SHA256SUMS.txt`

            ### 🍏 Instructions macOS (Installation .DMG) :
            1. Téléchargez et ouvrez le fichier `.dmg` ci-dessus.
            2. Glissez l'application **Lecteur Dossier Journalistes** dans votre dossier **Applications**.
            3. **Premier lancement :** Faites **Clic droit (ou Control + Clic)** sur l'application dans Applications → Cliquez sur **Ouvrir** → Confirmez avec **Ouvrir**.
            4. Placez l'archive officielle `dossier-journalistes-tourbiere-blainville-stablex.zip` dans votre dossier Téléchargements.
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
