name: "CodeQL Security Analysis"

# Déclenchement manuel uniquement : l'analyse automatique CodeQL est déjà gérée nativement
# par la configuration par défaut (Default Setup) dans les paramètres de sécurité du dépôt GitHub.
# GitHub rejette l'envoi de SARIF personnalisé lorsque le Default Setup est activé ("CodeQL analyses
# from advanced configurations cannot be processed when the default setup is enabled").
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
