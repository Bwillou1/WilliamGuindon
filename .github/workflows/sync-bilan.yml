name: Synchronisation Bilan 2026 (Google Sheets)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-bilan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Synchroniser depuis Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-bilan.js

      - name: Commit et Push si modifié
        run: |
          git config --global user.name "Bilan Sync Bot"
          git config --global user.email "bot@github-actions.local"
          git add data/bilan-2026.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(sync): mise à jour automatique du bilan 2026 [skip ci]"
            git push
          fi
