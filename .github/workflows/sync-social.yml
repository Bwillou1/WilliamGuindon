name: Synchronisation Réseau Social (Facebook)

on:
  schedule:
    # Exécution automatique toutes les 6 heures (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Déclenchement manuel à la demande depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: sync-facebook-social
  cancel-in-progress: true

jobs:
  sync-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🔍 Extraction de la dernière publication Facebook
        id: fetch_fb
        run: |
          PAGE_URL="https://www.facebook.com/williamguindon.officiel"
          FALLBACK_URL="https://www.facebook.com/williamguindon.officiel"

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          echo "Récupération du flux public Facebook..."
          HTML_DATA=$(curl -s -L --max-time 15 -A "$USER_AGENT" "$PAGE_URL" || true)

          POST_URL=$(echo "$HTML_DATA" | grep -oE 'https://(www\.)?facebook\.com/[^"'\''<> ]+/(posts|permalink|videos)/[0-9]+' | head -n 1 || true)

          if [ -z "$POST_URL" ]; then
            POST_URL=$(echo "$HTML_DATA" | grep -oE 'https://(www\.)?facebook\.com/[0-9]+' | head -n 1 || true)
          fi

          if [ -n "$POST_URL" ]; then
            echo "✔ Publication détectée : $POST_URL"
            FINAL_URL="$POST_URL"
          else
            echo "⚠ Aucune publication isolée, application du fallback : $FALLBACK_URL"
            FINAL_URL="$FALLBACK_URL"
          fi

          echo "post_url=$FINAL_URL" >> $GITHUB_OUTPUT

      - name: ✏️ Mise à jour du fichier index.html
        run: |
          NEW_URL="${{ steps.fetch_fb.outputs.post_url }}"
          TARGET_FILE="index.html"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "✖ Fichier $TARGET_FILE introuvable."
            exit 1
          fi

          sed -i.bak -E "/#FB_LATEST/s|data-href=\"[^\"]*\"|data-href=\"$NEW_URL\"|" "$TARGET_FILE"
          rm -f "${TARGET_FILE}.bak"

          echo "✔ Ligne #FB_LATEST mise à jour avec data-href=\"$NEW_URL\""

      - name: 🚀 Git Commit & Push automatique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet index.html; then
            echo "Aucune modification détectée dans index.html. Aucun commit nécessaire."
          else
            git add index.html
            git commit -m "chore(social): synchronisation de la dernière publication Facebook [skip ci]"
            git push
            echo "✔ Mise à jour déployée avec succès."
          fi
