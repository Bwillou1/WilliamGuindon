name: Ping moteurs de recherche et IA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow (Bing, ChatGPT Search, Copilot, Seznam, Naver, Yandex) - Custom Domain
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "williamguindon.me",
              "key": "8781d75e5905f04a95157c0c264d928b",
              "keyLocation": "https://williamguindon.me/8781d75e5905f04a95157c0c264d928b.txt",
              "urlList": [
                "https://williamguindon.me/",
                "https://williamguindon.me/en.html",
                "https://williamguindon.me/es.html",
                "https://williamguindon.me/stablex.html",
                "https://williamguindon.me/presse.html",
                "https://williamguindon.me/communiques.html",
                "https://williamguindon.me/registre-cce-sem26003.html",
                "https://williamguindon.me/live.html",
                "https://williamguindon.me/ai.html",
                "https://williamguindon.me/txt.html",
                "https://williamguindon.me/llms.txt",
                "https://williamguindon.me/ai.txt"
              ]
            }' -w "\nIndexNow Custom Domain HTTP: %{http_code}\n"

      - name: Archive Wayback Machine (preuve d'anteriorite + crawl IA)
        run: |
          curl -s "https://web.archive.org/save/https://williamguindon.me/" \
            -o /dev/null -w "Wayback HTTP: %{http_code}\n" || true
