name: Ping moteurs de recherche, Google Actualités et IA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exécution du protocole de ping multi-canaux (IndexNow, WebSub, Wayback Machine)
        run: node scripts/ping-search-ai.js
