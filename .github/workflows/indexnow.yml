name: Ping IA, Moteurs de recherche & Archivage Wayback Machine

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exécution du protocole de ping multi-canaux (IndexNow IA, WebSub, Wayback Machine)
        run: node scripts/ping-search-ai.js
