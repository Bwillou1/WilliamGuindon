00" letter-spacing=".08em">CCE / ACEUM · DOSSIER SEM-26-003 · EN DIRECT</text><text x="1090" y="62" fill="#6ee7b7" font-size="14" font-weight="700" text-anchor="end">ÉCHÉANCE : 16 OCTOBRE 2026</text></g><text x="600" y="132" fill="#fff" font-size="34" font-weight="800" letter-spacing="-.02em" text-anchor="middle">HORLOGE OFFICIELLE — RÉPONSE DU CANADA</text><text x="600" y="168" fill="#93c5fd" font-size="17" font-weight="500" text-anchor="middle">Décompte en temps réel avant la réponse exigée au gouvernement fédéral (Art. 24.27 ACEUM)</text><g transform="translate(120, 205)"><rect width="215" height="175" class="unit-card"/><text id="cd-days" x="107" y="105" class="unit-num">13</text><text x="107" y="148" class="unit-lbl">Jours</text></g><g transform="translate(365, 205)"><rect width="215" height="175" class="unit-card"/><text id="cd-hours" x="107" y="105" class="unit-num">08</text><text x="107" y="148" class="unit-lbl">Heures</text></g><g transform="translate(610, 205)"><rect width="215" height="175" class="unit-card"/><text id="cd-mins" x="107" y="105" class="unit-num">01</text><text x="107" y="148" class="unit-lbl">Minutes</text></g><g transform="translate(855, 205)"><rect width="215" height="175" class="unit-card-sec"/><text id="cd-secs" x="107" y="105" class="unit-num-sec" style="display:none">15</text><g id="css-secs-container"><text x="107" y="105" class="unit-num-sec sf-frame sf-0">15</text><text x="107" y="105" class="unit-num-sec sf-frame sf-1">14</text><text x="107" y="105" class="unit-num-sec sf-frame sf-2">13</text><text x="107" y="105" class="unit-num-sec sf-frame sf-3">12</text><text x="107" y="105" class="unit-num-sec sf-frame sf-4">11</text><text x="107" y="105" class="unit-num-sec sf-frame sf-5">10</text><text x="107" y="105" class="unit-num-sec sf-frame sf-6">09</text><text x="107" y="105" class="unit-num-sec sf-frame sf-7">08</text><text x="107" y="105" class="unit-num-sec sf-frame sf-8">07</text><text x="107" y="105" class="unit-num-sec sf-frame