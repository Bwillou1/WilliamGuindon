<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#02150e;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!--
    Compte à rebours officiel CCE / ACEUM SEM-26-003 — William Guindon
    Architecture hybride :
    - Mode interactif (vue directe / iframe) : horloge JavaScript temps réel synchronisée
    - Mode statique (balise <img> / Markdown) : animation vectorielle pure CSS cadencée
    Remerciements à Tom Kwok pour le projet open source svgasm :
    https://github.com/tomkwok/svgasm (Licence Apache-2.0)
  -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02150e" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.09)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.45)" />
    </linearGradient>
    <linearGradient id="sec-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(34,197,94,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)" />
    </linearGradient>
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { r: 5px; opacity: 1; }
      50% { r: 9px; opacity: 0.35; }
      100% { r: 5px; opacity: 1; }
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 132px 58px;
    }
    .unit-card {
      rx: 16px;
      fill: url(#card-grad);
      stroke: rgba(52, 211, 153, 0.35);
      stroke-width: 1.5;
    }
    .unit-card-sec {
      rx: 16px;
      fill: url(#sec-card-grad);
      stroke: rgba(52, 211, 153, 0.6);
      stroke-width: 2;
    }
    .unit-num {
      font-size: 72px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      font-variant-numeric: tabular-nums;
    }
    .unit-num-sec {
      font-size: 72px;
      font-weight: 800;
      fill: #34d399;
      text-anchor: middle;
      font-variant-numeric: tabular-nums;
    }
    .unit-lbl {
      font-size: 15px;
      font-weight: 700;
      fill: #a7f3d0;
      text-anchor: middle;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Animation d'images-clés CSS sans JavaScript inspirée de svgasm (Tom Kwok) */
    @keyframes svgasm-step {
      0% { opacity: 1; visibility: visible; }
      1.666% { opacity: 1; visibility: visible; }
      1.667% { opacity: 0; visibility: hidden; }
      100% { opacity: 0; visibility: hidden; }
    }
    .sf-frame {
      opacity: 0;
      visibility: hidden;
      animation: svgasm-step 60s infinite;
    }
    .sf-0 {
      opacity: 1;
      visibility: visible;
    }
    .sf-0 { animation-delay: 0s; }
    .sf-1 { animation-delay: 1s; }
    .sf-2 { animation-delay: 2s; }
    .sf-3 { animation-delay: 3s; }
    .sf-4 { animation-delay: 4s; }
    .sf-5 { animation-delay: 5s; }
    .sf-6 { animation-delay: 6s; }
    .sf-7 { animation-delay: 7s; }
    .sf-8 { animation-delay: 8s; }
    .sf-9 { animation-delay: 9s; }
    .sf-10 { animation-delay: 10s; }
    .sf-11 { animation-delay: 11s; }
    .sf-12 { animation-delay: 12s; }
    .sf-13 { animation-delay: 13s; }
    .sf-14 { animation-delay: 14s; }
    .sf-15 { animation-delay: 15s; }
    .sf-16 { animation-delay: 16s; }
    .sf-17 { animation-delay: 17s; }
    .sf-18 { animation-delay: 18s; }
    .sf-19 { animation-delay: 19s; }
    .sf-20 { animation-delay: 20s; }
    .sf-21 { animation-delay: 21s; }
    .sf-22 { animation-delay: 22s; }
    .sf-23 { animation-delay: 23s; }
    .sf-24 { animation-delay: 24s; }
    .sf-25 { animation-delay: 25s; }
    .sf-26 { animation-delay: 26s; }
    .sf-27 { animation-delay: 27s; }
    .sf-28 { animation-delay: 28s; }
    .sf-29 { animation-delay: 29s; }
    .sf-30 { animation-delay: 30s; }
    .sf-31 { animation-delay: 31s; }
    .sf-32 { animation-delay: 32s; }
    .sf-33 { animation-delay: 33s; }
    .sf-34 { animation-delay: 34s; }
    .sf-35 { animation-delay: 35s; }
    .sf-36 { animation-delay: 36s; }
    .sf-37 { animation-delay: 37s; }
    .sf-38 { animation-delay: 38s; }
    .sf-39 { animation-delay: 39s; }
    .sf-40 { animation-delay: 40s; }
    .sf-41 { animation-delay: 41s; }
    .sf-42 { animation-delay: 42s; }
    .sf-43 { animation-delay: 43s; }
    .sf-44 { animation-delay: 44s; }
    .sf-45 { animation-delay: 45s; }
    .sf-46 { animation-delay: 46s; }
    .sf-47 { animation-delay: 47s; }
    .sf-48 { animation-delay: 48s; }
    .sf-49 { animation-delay: 49s; }
    .sf-50 { animation-delay: 50s; }
    .sf-51 { animation-delay: 51s; }
    .sf-52 { animation-delay: 52s; }
    .sf-53 { animation-delay: 53s; }
    .sf-54 { animation-delay: 54s; }
    .sf-55 { animation-delay: 55s; }
    .sf-56 { animation-delay: 56s; }
    .sf-57 { animation-delay: 57s; }
    .sf-58 { animation-delay: 58s; }
    .sf-59 { animation-delay: 59s; }
  </style>

  <!-- Fond avec dégradé riche -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Motif géométrique d'arrière-plan -->
  <circle cx="600" cy="315" r="460" fill="none" stroke="rgba(52,211,153,0.04)" stroke-width="2" />
  <circle cx="600" cy="315" r="320" fill="none" stroke="rgba(52,211,153,0.06)" stroke-width="1.5" />
  <circle cx="600" cy="315" r="180" fill="none" stroke="rgba(52,211,153,0.08)" stroke-width="1" />

  <!-- Header : Badge officiel CCE -->
